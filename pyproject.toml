[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting-ab-testing"
version = "0.1.0"
description = "Weekly demand forecasting and powered A/B experiment analysis."
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.5,<5.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    "statsmodels>=0.14,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["demand_forecasting*"]
