name: Forecasting and experiment CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m demand_forecasting --output-dir output
      - uses: actions/upload-artifact@v4
        with:
          name: forecasting-ab-test-results
          path: |
            output/metrics.json
            output/forecast_backtest_predictions.csv
            output/synthetic_ab_experiment.csv
